services:
  server:
    image: ${SERVER_DEV_IMAGE:-discorde-server-dev}
    working_dir: /work/server
    # --timeout-keep-alive matches the Dockerfile CMD (see its comment): keeps the dev server's
    # keep-alive boundary as far from a browser's idle gaps as the production image's.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --timeout-keep-alive 75
    environment:
      DISCORDE_DATA_DIR: /data
      DISCORDE_CONTENT_DIR: /work/content
      DISCORDE_STATIC_DIR: /nonexistent
      SPACY_MODEL: fr_core_news_sm
    volumes: [".:/work", "discorde-dev-data:/data"]
    ports: ["${DEV_API_PORT:-8080}:8080"]
  web:
    image: node:22
    working_dir: /work/web
    command: npm run dev
    environment: { API_PROXY: "http://server:8080" }
    volumes: [".:/work", "node_modules:/work/web/node_modules"]
    ports: ["${DEV_WEB_PORT:-5173}:5173"]
    depends_on: [server]
volumes:
  discorde-dev-data:
  node_modules:
    name: ${NODE_MODULES_VOLUME:-discorde-web-node_modules}
    external: true
