services:
  discorde:
    image: discorde:local
    # The build stamp (GET /api/health, the lyre's credits), from the environment: README, "Quick
    # start". Unset, the stamp says "unknown".
    build:
      context: .
      args: { GIT_COMMIT: "${GIT_COMMIT:-unknown}", BUILD_DATE: "${BUILD_DATE:-unknown}" }
    container_name: discorde
    # The host side is an uncommon port so the game sits beside other services; inside the
    # container it stays 8080.
    ports: ["38417:8080"]
    volumes: ["discorde-data:/data"]
    # The voice (spec 2026-09-27 §6): started with the game, but no health condition, so the game
    # starts even while the voice is still loading its model.
    depends_on: [tts]
    restart: unless-stopped
  tts:
    image: discorde-tts:local
    build:
      context: tts
      args: { GIT_COMMIT: "${GIT_COMMIT:-unknown}", BUILD_DATE: "${BUILD_DATE:-unknown}" }
    container_name: discorde-tts
    # Every line it has made (no backup needed: each one can be made again).
    volumes: ["discorde-tts-cache:/cache"]
    restart: unless-stopped
volumes:
  discorde-data:
  discorde-tts-cache:
