services:
  app:
    build: .
    # scripts/lib.sh sets APP_IMAGE, NODE_MODULES_VOLUME and PLAYWRIGHT_VERSION per STACK (README
    # §6); the defaults are the main checkout's names.
    image: ${APP_IMAGE:-discorde:local}
    environment:
      {
        DISCORDE_DATA_DIR: /tmp/data,
        DISCORDE_ALEXANDRIA_OFFLINE_DIR: /fixtures/alexandria,
        DISCORDE_TEST_HOOKS: "1",
      }
    volumes: ["./server/tests/fixtures:/fixtures:ro"]
    # Reached as http://discorde:8080, not http://app:8080: `app` is a gTLD on Chromium's HSTS
    # preload list, so Chromium (the `chromium` project, playwright.config.ts) forces HTTPS on it.
    # The alias lives in this compose project's own network, so every STACK keeps the same BASE_URL.
    # No published port: only the playwright container talks to the app.
    networks: { default: { aliases: [discorde] } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  playwright:
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:?run through scripts/playwright.sh}-noble
    working_dir: /work/web
    # WebKit renders on the CPU in this container (Mesa llvmpipe, no GPU), and by default llvmpipe
    # starts one raster thread per core in every page: an idle camp scene alone burned ~4.5 cores,
    # 8 workers ~21 cores and 7.5 GiB, the host fell to ~0.6 GB free, 8 concurrent camp pages ran
    # at ~14 fps with rAF gaps over 1 s (a typewriter line or a click's "stable" check waits on
    # rAF), and WebKit's Skia GPU worker segfaulted repeatedly. Two llvmpipe threads plus Skia's
    # CPU rasteriser: ~1.7 cores per idle scene, ~28 fps and no gap over 250 ms at 8 pages, 4.9 GiB
    # peak (numbers: .superpowers/sdd/2026-09-24-ui3a-places-title-library-delphi/
    # e2e-stability-report.md).
    environment:
      BASE_URL: "http://discorde:8080"
      CI: "true"
      LP_NUM_THREADS: "2"
      WEBKIT_SKIA_ENABLE_CPU_RENDERING: "1"
    volumes: [".:/work", "node_modules:/work/web/node_modules"]
    depends_on:
      app: { condition: service_healthy }
    ipc: host
    # No core dumps: a crashing browser process would write a multi-GB core.<pid> into web/ (the
    # bind-mounted working directory). Crash counting uses its own override, see
    # .superpowers/sdd/2026-09-24-ui3a-places-title-library-delphi/fix-wave-a-report.md.
    ulimits:
      core: 0
volumes:
  node_modules:
    name: ${NODE_MODULES_VOLUME:-discorde-web-node_modules}
    external: true
